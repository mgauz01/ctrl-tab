<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ctrl+Q Switcher</title>
    <link rel="stylesheet" href="overlay.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(
            120% 90% at 50% 100%,
            rgba(59, 130, 246, 0.22) 0%,
            transparent 60%
          ),
          linear-gradient(160deg, #0b1020 0%, #11162a 55%, #0b1020 100%);
        background-attachment: fixed;
      }

      /* In the popup window the whole surface is the menu, so fill it
         and hug the tab cards tightly (minimal vertical padding). */
      #ctrl-tab-root .ctrl-tab-panel {
        height: 100vh;
        align-items: center;
        padding: 14px 12px;
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border-top: none;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <script type="module" src="fallback.js"></script>
  </body>
</html>
