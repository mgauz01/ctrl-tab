<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ctrl+Q Switcher</title>
    <link rel="stylesheet" href="overlay.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* Match in-page panel tokens so popup isn't a different product. */
        background: linear-gradient(
          to top,
          rgba(18, 22, 33, 0.55) 0%,
          rgba(18, 22, 33, 0.28) 55%,
          rgba(18, 22, 33, 0.12) 100%
        );
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background: linear-gradient(
            to top,
            rgba(226, 232, 240, 0.95) 0%,
            rgba(241, 245, 249, 0.8) 55%,
            rgba(248, 250, 252, 0.4) 100%
          );
        }
      }

      #ctrl-tab-root .ctrl-tab-panel {
        height: 100vh;
        max-height: none;
        justify-content: center;
        padding: 14px 12px;
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border-top: none;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <script type="module" src="fallback.js"></script>
  </body>
</html>
